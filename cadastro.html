
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Funcionário - Açougue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header class="page-header">
      <h2>🥩 Cadastro de Funcionário</h2>
      <a href="index.html" class="btn btn-secondary">Voltar à Lista</a>
    </header>

    <form id="formFuncionario">
      
      <!-- Dados Pessoais -->
      <fieldset>
        <legend>Dados Pessoais</legend>
        
        <div class="input-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" required placeholder="Ex: João da Silva">
        </div>

        <div class="form-row">
          <div class="input-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" maxlength="14" required placeholder="000.000.000-00">
          </div>

          <div class="input-group">
            <label for="dataNascimento">Data de Nascimento</label>
            <input type="date" id="dataNascimento" name="dataNascimento" required>
          </div>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="funcionario@acougue.com">
          </div>

          <div class="input-group">
            <label for="telefone">Telefone / WhatsApp</label>
            <input type="tel" id="telefone" name="telefone" required placeholder="(00) 90000-0000">
          </div>
        </div>
      </fieldset>

      <!-- Dados Profissionais -->
      <fieldset>
        <legend>Dados Profissionais & Setor</legend>
        
        <div class="form-row">
          <div class="input-group">
            <label for="cargo">Cargo</label>
            <select id="cargo" name="cargo" required>
              <option value="">Selecione...</option>
              <option value="Açougueiro">Açougueiro</option>
              <option value="Auxiliar de Açougue">Auxiliar de Açougue</option>
              <option value="Atendente de Balcão">Atendente de Balcão</option>
              <option value="Desossador">Desossador</option>
              <option value="Caixa">Caixa</option>
              <option value="Gerente de Loja">Gerente de Loja</option>
              <option value="Repositor / Câmara Fria">Repositor / Câmara Fria</option>
            </select>
          </div>

          <div class="input-group">
            <label for="especialidade">Especialidade Principal</label>
            <select id="especialidade" name="especialidade">
              <option value="Cortes Tradicionais">Cortes Tradicionais</option>
              <option value="Cortes Nobres / Parrilla">Cortes Nobres / Parrilla</option>
              <option value="Desossa Rápida">Desossa Rápida</option>
              <option value="Aves e Suínos">Aves e Suínos</option>
              <option value="Atendimento Geral">Atendimento Geral</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label for="salario">Salário Base (R$)</label>
            <input type="number" id="salario" name="salario" step="0.01" min="0" required placeholder="0.00">
          </div>

          <div class="input-group">
            <label for="insalubridade">Insalubridade</label>
            <select id="insalubridade" name="insalubridade" required>
              <option value="Sim (Câmara Fria / Lâminas)">Sim</option>
              <option value="Não">Não</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label for="turno">Turno de Trabalho</label>
            <select id="turno" name="turno" required>
              <option value="">Selecione...</option>
              <option value="Manhã (06h - 14h)">Manhã (06h - 14h)</option>
              <option value="Tarde (12h - 20h)">Tarde (12h - 20h)</option>
              <option value="Fechamento / Limpeza">Fechamento / Limpeza</option>
              <option value="Integral / Escala 6x1">Integral / Escala 6x1</option>
            </select>
          </div>

          <div class="input-group">
            <label for="dataAdmissao">Data de Admissão</label>
            <input type="date" id="dataAdmissao" name="dataAdmissao" required>
          </div>
        </div>
      </fieldset>

      <!-- Endereço com Busca de CEP -->
      <fieldset>
        <legend>Endereço Residencial</legend>
        
        <div class="form-row">
          <div class="input-group">
            <label for="cep">CEP <span id="cepStatus" class="status-cep"></span></label>
            <input type="text" id="cep" name="cep" maxlength="9" placeholder="00000-000">
          </div>

          <div class="input-group" style="flex: 2;">
            <label for="logradouro">Rua / Logradouro</label>
            <input type="text" id="logradouro" name="logradouro" required placeholder="Preenchido pelo CEP...">
          </div>
        </div>

        <div class="form-row">
          <div class="input-group col-small">
            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero" required placeholder="123">
          </div>

          <div class="input-group">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" name="bairro" required placeholder="Preenchido pelo CEP...">
          </div>

          <div class="input-group">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" required placeholder="Preenchido pelo CEP...">
          </div>

          <div class="input-group col-small">
            <label for="uf">UF</label>
            <input type="text" id="uf" name="uf" required maxlength="2" placeholder="UF">
          </div>
        </div>
      </fieldset>

      <button type="submit" class="btn btn-success">Salvar Funcionário</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
